services:
  # The FastAPI Web Service
  - type: web
    name: agrimitra-api
    env: python
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agrimitra-db # Render managed PostgreSQL or external Supabase connection string
          property: connectionString
      - key: CORS_ORIGIN
        value: "https://agrimitra.vercel.app" # Replace with actual Vercel domain

  # The Nightly Cron Job for Data Refresh
  - type: cron
    name: agrimitra-data-refresh
    env: python
    schedule: "0 0 * * *" # Run at midnight every day
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python cron/refresh_data.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agrimitra-db
          property: connectionString
      - key: AGMARKNET_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
